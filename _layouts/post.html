---
layout: default
---

<div class="container">
    <div class="row">
        <div class="col-md-2">
            <!-- Left margin -->
        </div>

        <div class="col-md-8 flex-first flex-md-unordered">
            <div class="mainheading">
                <h1 class="posttitle">{{ page.title }}</h1>
            </div>

            <!-- Post Featured Image -->
            {% if page.image %}
            <div class="text-center mb-4">
                <img class="featured-image img-fluid rounded shadow-sm" src="{% if page.image contains "://" %}{{ page.image }}{% else %}{{ site.baseurl }}/{{ page.image }}{% endif %}" alt="{{ page.title }}" style="max-height: 400px; object-fit: contain;">
            </div>
            {% endif %}

            <!-- Post Content -->
            <div class="article-post">
                {{ content }}
            </div>

            <!-- Post Date -->
            <div class="mt-4 pt-3 border-top text-muted">
                <small>
                    <time class="post-date" datetime="{{ page.date | date:"%Y-%m-%d" }}">{{ page.date | date_to_string }}</time>
                    {% if page.last_modified_at %}
                    (Updated: <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: "%b %-d, %Y" }}</time>)
                    {% endif %}
                </small>
            </div>
            
            <div class="mt-4 text-center">
                <a href="{{ site.baseurl }}/publications" class="btn btn-outline-dark btn-sm">&larr; Back to Publications</a>
            </div>

        </div>
    </div>
</div>
